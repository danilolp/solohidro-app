<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoloHidro ERP</title>
<meta name="theme-color" content="#0b3159">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SoloHidro">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b3159;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#eaf2fb;-webkit-tap-highlight-color:transparent}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:14px;box-sizing:border-box}
  .mark{width:120px;height:120px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:6px}
  .mark img{width:88px;height:88px;object-fit:contain}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px}
  p{margin:0;color:#7fa2c4;font-size:13px}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:100%;max-width:280px}
  button.b{border:none;font-weight:700;padding:13px 24px;border-radius:26px;font-size:15px;cursor:pointer}
  .b-open{background:#00b4d8;color:#062a3d}
  .b-inst{background:#f6a93b;color:#3a2400;display:none}
  .b:active{transform:scale(.98)}
  .hint{margin-top:8px;color:#5f86ab;font-size:11.5px;max-width:300px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><img src="icon-512.png" alt="SoloHidro"></div>
  <h1>SoloHidro ERP</h1>
  <p>Sistema de Gestão</p>
  <div class="btns">
    <button class="b b-inst" id="inst">Instalar na tela inicial</button>
    <button class="b b-open" id="open">Abrir o ERP &rsaquo;</button>
  </div>
  <div class="hint" id="hint">Para instalar com o ícone da SoloHidro: toque em &vellip; (menu do Chrome) &rsaquo; <b>Instalar app</b>.</div>
</div>
<script>
  var ERP="https://script.google.com/macros/s/AKfycbxP-aiPavTC6QMnO7cXmB1y7DCdPz1NwmalFYKhxlr31mN2tMBtlJv2SaXviSP6nFRE/exec";
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  var p=new URLSearchParams(location.search);
  // App já instalado (abriu em tela cheia) ou atalho ?app=1 -> vai direto pro ERP
  if(p.get('app')==='1'||standalone){ location.replace(ERP); }

  document.getElementById('open').addEventListener('click',function(){ location.href=ERP; });

  // Botão instalar (Chrome Android dispara beforeinstallprompt quando é instalável)
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault(); deferred=ev;
    var b=document.getElementById('inst'); b.style.display='block';
    document.getElementById('hint').innerHTML='Toque em <b>Instalar na tela inicial</b> para adicionar o app com o ícone da SoloHidro.';
  });
  document.getElementById('inst').addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function(){ deferred=null; document.getElementById('inst').style.display='none'; });
  });
  window.addEventListener('appinstalled',function(){ document.getElementById('inst').style.display='none'; });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
